# ============================================================
# TrackTx Parameters — Human K562 PRO-seq, Celastrol treatment
# GEO: GSE96869 | Dukler et al. 2017, Genome Research
# DOI: 10.1101/gr.217935.116
# Cell type: K562 | Protocol: PRO-seq SE
# Stress: Celastrol (pharmacological HSF1 activator, heat shock mimic)
# Time course: 0, 10, 20, 40, 60, 160 min
# ============================================================
#
# ROLE: Validation dataset. Celastrol activates HSF1 and mimics heat shock
# via proteotoxic stress (inhibits HSP90). Compare HSP gene induction,
# PI changes, and enhancer activity patterns vs. thermal heat shock data.
#
# PRIMARY CONTRAST: 0 min vs. 40 min (peak HSP induction ~40-60 min).
# All timepoints included for trajectory comparison if needed.
#
# Spike-in: dm6, confirmed. Dukler et al. 2017 methods: "an equal number of
# permeable Drosophila cells were spiked in to each sample prior to run-on";
# ~0.5M reads (0.1%) derived from the Drosophila spike-in.

# --- Core ---
samplesheet: "samplesheets/human_K562_dukler2017.csv"
sample_source: "srr"
paired_end: false                  # SE PRO-seq
output_dir: "./results/human_K562_GSE96869_celastrol"

# --- Genome ---
reference_genome: "hs1"
spikein_genome: "dm6"             # Confirmed — Drosophila spike-in, Dukler 2017 methods
control_label: "no_treatment"     # REQUIRED for correct siCPM — must match the baseline
                                   # condition name below exactly (module 08 has no
                                   # fallback if this doesn't match; see nextflow.config)
annotation_source: "refseq"      # RefSeq = most complete annotation for hs1/T2T
annotation_exclude_biotypes: ""  # No biotypes excluded (project-wide policy)
annotation_chr_naming: "none"     # hs1/T2T RefSeq native naming (matches vihervaara2020)

# --- Adapter trimming ---
# Danko lab SE PRO-seq: TruSeq Small RNA 3' adapter (same as Lis lab)
adapter_trimming:
  enabled: true
  preset: "custom"
  adapter1: "TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC"
  minlen: 12

# --- UMI ---
umi:
  enabled: false                   # No UMI in 2017 protocol

# --- Barcode ---
barcode:
  enabled: false

# --- Normalization ---
norm:
  emit_bw: true
  emit_sicpm: true                 # dm6 spike-in, confirmed (Dukler 2017 methods)
  emit_allmap: true
  emit_5p: true                    # forced on (all-output policy); SE, so less meaningful than PE
  gene_end_method: tes_window
  gene_end_window: 500
  gene_end_min_reads: 10

# --- Replicates ---
replicates:
  merge: true
  concordance_method: pearson
  concordance_min: 0.85            # Slightly relaxed — time course data

# --- Polymerase contrasts ---
# Primary: untreated vs. peak celastrol response
pol:
  contrasts:
    - ["celastrol", 40, "no_treatment",  0]    # PRIMARY: 40min vs untreated
    - ["celastrol", 60, "no_treatment",  0]    # 60min vs untreated
    - ["celastrol", 20, "no_treatment",  0]    # early response
    - ["celastrol", 160, "no_treatment", 0]    # late/sustained response
  top_n: 100
  plots: true

# --- Divergent transcription ---
advanced:
  divergent_threshold: auto
  divergent_sum_thr: auto
  divergent_fdr: 0.05
  divergent_calibration_percentile: 65
  divergent_calibration_sum_multiplier: 1.5
  divergent_merge_gap: 150
  divergent_nt_window: 1000
  divergent_balance: 0.0
  divergent_qc: true

# --- Functional region geometry ---
functional_regions:
  tss_active_pm: 500
  prom_up: 500
  prom_down: 250

# --- Output ---
publish_trimmed_fastq: true
publish_alignments: true
output:
  cpm: true
  crpmsi: true
  raw_tracks: true
  bigwig: true
  bedgraph: true
