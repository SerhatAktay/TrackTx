# ============================================================
# TrackTx Parameters — Human K562 PRO-seq, Heat Shock
# GEO: GSE89230 | Vihervaara et al. 2017, Nat Commun
# DOI: 10.1038/s41467-017-00907-6
# Cell type: K562 | Protocol: PRO-seq SE
# Stress: 42°C, 30 min | Conditions: NHS + HS30
# ============================================================
#
# ROLE: Validation dataset. SE predecessor to primary human dataset (GSE154746 PE).
# Use to confirm PI and eCluster results are stable across protocol generations.
# Original paper used hg19; we re-align to hs1 (T2T) for consistency.
#
# Library: Kwak 2013 SE PRO-seq protocol, TruSeq small RNA 3' adapter.
# No UMI (pre-UMI era for this lab — UMIs introduced ~2020).
# Spike-in: Drosophila S2 nuclei → dm6 (Vihervaara lab standard).

# --- Core ---
samplesheet: "samplesheets/human_K562_vihervaara2017.csv"
sample_source: "srr"
paired_end: false                  # SE PRO-seq
output_dir: "./results/human_K562_GSE89230_2017"

# --- Genome ---
reference_genome: "hs1"           # T2T-CHM13v2 — standardized with other human datasets
spikein_genome: "dm6"
control_label: "no_heat_shock"   # REQUIRED for correct siCPM — must match the baseline
                                  # condition name below exactly (module 08 has no
                                  # fallback if this doesn't match; see nextflow.config)
annotation_source: "refseq"      # RefSeq = most complete annotation for hs1/T2T
annotation_exclude_biotypes: ""  # No biotypes excluded (project-wide policy)
annotation_chr_naming: "none"     # hs1/T2T RefSeq native naming (matches vihervaara2020)

# --- Adapter trimming ---
# Kwak 2013 / Lis lab SE protocol: TruSeq Small RNA 3' adapter
adapter_trimming:
  enabled: true
  preset: "custom"
  adapter1: "TGGAATTCTCGGGTGCCAAGG"
  minlen: 12

# --- UMI ---
umi:
  enabled: false                   # No UMI in 2017 protocol

# --- Barcode ---
barcode:
  enabled: false

# --- Normalization ---
norm:
  emit_bw: true
  emit_sicpm: true                 # dm6 spike-in present
  emit_allmap: true
  emit_5p: true                    # forced on (all-output policy); SE, so less meaningful than PE
  gene_end_method: tes_window
  gene_end_window: 500
  gene_end_min_reads: 10

# --- Replicates ---
replicates:
  merge: true
  concordance_method: pearson
  concordance_min: 0.90

# --- Polymerase contrasts ---
pol:
  contrasts:
    - ["heat_shock", 30, "no_heat_shock", 0]   # HS30 vs NHS
  top_n: 100
  plots: true

# --- Divergent transcription ---
advanced:
  divergent_threshold: auto
  divergent_sum_thr: auto
  divergent_fdr: 0.05
  divergent_calibration_percentile: 65
  divergent_calibration_sum_multiplier: 1.5
  divergent_merge_gap: 150
  divergent_nt_window: 1000
  divergent_balance: 0.0
  divergent_qc: true

# --- Functional region geometry ---
functional_regions:
  tss_active_pm: 500
  prom_up: 500
  prom_down: 250

# --- Output ---
publish_trimmed_fastq: true
publish_alignments: true
output:
  cpm: true
  crpmsi: true
  raw_tracks: true
  bigwig: true
  bedgraph: true

