# ============================================================
# TrackTx Parameters — Mouse mESC PRO-seq (Chivu, Danko, Lis et al. 2025)
# GEO: GSE223913 | Nat Struct Mol Biol, DOI: 10.1038/s41594-025-01718-y
# Cell type: mESC (NELFb-dTAG, serum/LIF conditions) — NELF-B intact (untreated dTAG)
# Protocol: PRO-seq PE (NextSeq 500) | Stress: 42°C, 30 min
# ============================================================
#
# PREFERRED MOUSE DATASET: PE sequencing, 3 biological replicates per condition,
# consistent library chemistry, and modern protocol.
# LIMITATION: mESC cell type (stem cells) differs from somatic cells used in
# other species (K562, DH82, MEF).
#
# Only samples with dtag-13 treatment = untreated are used here.
# (NELF-B/E depleted samples are excluded — they alter pausing dynamics.)
#
# Spike-in: Chivu 2025 used competitive alignment with mm10+dm3 merged genome
# (dm3 as spike-in), confirmed. Using true dm3 here — TrackTx's genome
# download step is generic (any UCSC assembly ID), and dm3.fa.gz is live on
# UCSC goldenPath, so there's no need to substitute dm6. (An earlier version
# of this file substituted dm6 on the assumption dm3 wasn't supported; that
# assumption was wrong and would have biased the siCPM scaling factor by
# aligning spike-in reads to the wrong fly assembly.)

# --- Core ---
samplesheet: "samplesheets/mouse_mESC_chivu2025.csv"
sample_source: "srr"
paired_end: true                  # PE PRO-seq confirmed (proseq2.0 pipeline)
output_dir: "./results/mouse_mESC_GSE223913"

# --- Genome ---
reference_genome: "mm10"          # GRCm38 (used in Chivu 2025)
spikein_genome: "dm3"              # Confirmed original spike-in genome (see note above)
control_label: "no_heat_shock"   # REQUIRED for correct siCPM — must match the baseline
                                  # condition name below exactly (module 08 has no
                                  # fallback if this doesn't match; see nextflow.config)
annotation_source: "refseq"
annotation_exclude_biotypes: ""  # No biotypes excluded (project-wide policy)
annotation_chr_naming: "none"

# --- Adapter trimming ---
# proseq2.0 / Danko-Lis lab PE protocol
adapter_trimming:
  enabled: true
  preset: "illumina"
  adapter1: "TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC"
  adapter2: "GATCGTCGGACTGTAGAACTCTGAACGTGTAGATCTCGGTGGTCGCCGTATCATT"   # incl. readthrough tail, matches other PE datasets
  minlen: 12

# --- UMI ---
# proseq2.0 uses 6 nt UMI at 5' end of R1
umi:
  enabled: true
  length: 6
  location: 5

# --- Barcode ---
barcode:
  enabled: false

# --- Normalization ---
norm:
  emit_bw: true
  emit_sicpm: true
  emit_allmap: true
  emit_5p: true                   # PE — 5' end tracks informative
  gene_end_method: tes_window
  gene_end_window: 500
  gene_end_min_reads: 10

# --- Replicates ---
replicates:
  merge: true
  concordance_method: pearson
  concordance_min: 0.90

# --- Polymerase contrasts ---
pol:
  contrasts:
    - ["heat_shock", 30, "no_heat_shock", 0]   # PRIMARY: HS30 vs NHS
  top_n: 100
  plots: true

# --- Divergent transcription ---
advanced:
  divergent_threshold: auto
  divergent_sum_thr: auto
  divergent_fdr: 0.05
  divergent_calibration_percentile: 65
  divergent_calibration_sum_multiplier: 1.5
  divergent_merge_gap: 150
  divergent_nt_window: 1000
  divergent_balance: 0.0
  divergent_qc: true

# --- Functional region geometry ---
functional_regions:
  tss_active_pm: 500
  prom_up: 500
  prom_down: 250

# --- Output ---
publish_trimmed_fastq: true
publish_alignments: true
output:
  cpm: true
  crpmsi: true
  raw_tracks: true
  bigwig: true
  bedgraph: true

# ============================================================
# Samplesheet provenance (moved from CSV — pipeline rejects # in CSV)
# ============================================================
# Samplesheet: Mouse mESC PRO-seq — Chivu, Basso, Danko, Lis et al. 2025
# GEO: GSE223913 | Paper: Chivu et al. 2025, Nat Struct Mol Biol
# DOI: 10.1038/s41594-025-01718-y
# Organism: Mus musculus | Cell type: mESC (serum/LIF, S/L conditions)
# Assembly: mm10 | Method: PRO-seq PE (NextSeq 500) | Spike-in: E. coli + dm3 (competitive)
# Stress: Heat shock 42°C, 30 min
# Degron: NELFb-dTAG (NELF-B inducible depletion system)
# 
# IMPORTANT CONTEXT:
# This dataset was generated to study NELF evolution. Only use samples where
# dtag-13 treatment = untreated (NELF-B intact). These are the clean WT controls.
# The dTAG-treated samples are not relevant for our cross-species analysis.
# 
# PREFERRED OVER GSE128160 for: PE sequencing, 3 replicates, consistent protocol
# LIMITATION: mESC cell type differs from somatic cells used in other species
# (K562=leukemia, DH82=macrophage, MEF=fibroblast)
# 
# SRX accessions:
# NHS (untreated dTAG, no HS) — mESCs NELFb, S/L:
# SRR23260631 = rep1 [EXCLUDED — see below], SRR23260630 = rep2, SRR23260629 = rep3
# HS 30min (untreated dTAG) — mESCs NELFb, 30min HS at 42°C:
# SRR23260625 = rep1, SRR23260624 = rep2, SRR23260623 = rep3
#
# ⚠️  SRR23260631 (NHS rep1) EXCLUDED FROM SAMPLESHEET (2026-07-04):
# SRA/ENA metadata tags it library_layout=PAIRED, but NCBI run info shows
# spots_with_mates=0 and only one FASTQ file is deposited (confirmed: it is
# the only run under experiment SRX19205932 / BioSample SAMN32949456, so no
# sibling run holds the R2 mate). fasterq-dump/ENA both produce R1 only.
# Since paired_end is a pipeline-wide setting in TrackTx (not per-sample),
# this run cannot be processed as PE alongside the rest. NHS now runs with
# 2 replicates (rep2, rep3) vs. 3 for HS30min — asymmetric but each arm
# still has replication.
# 
# Spike-in: Chivu 2025 used competitive alignment (mm10 + dm3 merged genome)
# for spike-in normalization. Confirmed dm3 works directly as spikein_genome
# (TrackTx's genome fetch is generic across any UCSC assembly ID) — no need
# for the dm6 substitution/gene_end fallback previously considered here.
