# ============================================================
# TrackTx Parameters — Mouse MEF PRO-seq
# GEO: GSE128160 | Vihervaara lab (companion to human GSE154746)
# Cell type: Mouse Embryonic Fibroblasts (MEF, WT)
# Protocol: PRO-seq SE | Stress: 42°C time course
# ============================================================
#
# ⚠️  MIXED LIBRARY CHEMISTRY — READ BEFORE RUNNING:
#
# GSE128160 genuinely mixes chemistry across its 6 unconditioned samples used
# here — confirmed per-sample from GEO's own submitted metadata:
#   uC_0HS_BR1:  no UMI,     5' adapter TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC
#   uC_0HS_BR2:  8nt 3' UMI, 5' adapter TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC
#   uC_25HS_BR1: 7nt 3' UMI, 5' adapter ATCTCGTATGCCGTCTTCTGCTTG
#   uC_25HS_BR2: 7nt 3' UMI, 5' adapter ATCTCGTATGCCGTCTTCTGCTTG
#   uC_40HS_BR1: 7nt 3' UMI, 5' adapter ATCTCGTATGCCGTCTTCTGCTTG
#   uC_40HS_BR2: 7nt 3' UMI, 5' adapter ATCTCGTATGCCGTCTTCTGCTTG
# (See GSM3665947–GSM3665952 on GEO.)
#
# PROJECT DECISION (final, 2026-07-21): ignore the 0HS-timepoint difference
# and process ALL samples with the 25HS/40HS chemistry — UMI enabled, 7nt,
# 3' end; adapter1 = ATCTCGTATGCCGTCTTCTGCTTG. This matches 4 of 6 samples
# exactly and is a deliberate simplification for the other 2 (uC_0HS_BR1/BR2,
# the no-treatment baseline): BR1 has no real UMI, so umi_tools will strip 7
# "random" bases that are actually genomic 3' sequence, slightly truncating
# that replicate's reads; BR2's real UMI is 8nt, so stripping 7 will leave a
# stray 1nt tag on its reads. Both baseline replicates were also prepared
# with a different 5' adapter than what's configured here, so a small
# fraction of adapter readthrough in those two samples may go untrimmed.
# Net effect: some noise concentrated in the 0-min (no_heat_shock) baseline
# specifically — worth keeping in mind if that condition looks off.
#
# NOTE: This is SE PRO-seq, so divergent transcription calling will
# work but has lower resolution than PE for precise TSS/TES calling.
# mouse_mESC_chivu2025.yaml (PE, 3 reps, clean chemistry) remains the
# higher-confidence mouse dataset if MEF results look unstable.

# --- Core ---
samplesheet: "samplesheets/mouse_MEF_vihervaara2019.csv"
sample_source: "srr"
paired_end: false                  # SE PRO-seq
output_dir: "./results/mouse_MEF_GSE128160"

# --- Genome ---
reference_genome: "mm10"          # GRCm38 (original assembly for this dataset)
spikein_genome: "dm6"             # Drosophila spike-in (Lis lab standard)
control_label: "no_heat_shock"   # REQUIRED for correct siCPM — must match the baseline
                                  # condition name below exactly (module 08 has no
                                  # fallback if this doesn't match; see nextflow.config)
annotation_source: "refseq"
annotation_exclude_biotypes: ""  # No biotypes excluded (project-wide policy)
annotation_chr_naming: "none"

# --- Adapter trimming ---
# Using the 25HS/40HS adapter (ATCTCGTATGCCGTCTTCTGCTTG) for all 6 samples —
# see project decision above. Does not exactly match uC_0HS_BR1/BR2's real
# 5' adapter (TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC).
adapter_trimming:
  enabled: true
  preset: "custom"
  adapter1: "ATCTCGTATGCCGTCTTCTGCTTG"
  minlen: 12

# --- UMI ---
# 7nt, 3' end — matches uC_25HS/uC_40HS (4 of 6 samples) exactly; applied
# uniformly to uC_0HS_BR1/BR2 too, see project decision above.
umi:
  enabled: true
  length: 7
  location: "3"

# --- Barcode ---
barcode:
  enabled: false

# --- Normalization ---
norm:
  emit_bw: true
  emit_sicpm: true
  emit_allmap: true
  emit_5p: true                   # forced on (all-output policy); SE, so less meaningful than PE
  gene_end_method: tes_window
  gene_end_window: 500
  gene_end_min_reads: 10

# --- Replicates ---
replicates:
  merge: true
  concordance_method: pearson
  concordance_min: 0.85           # slightly relaxed due to mixed chemistry

# --- Polymerase contrasts ---
pol:
  contrasts:
    - ["heat_shock", 25, "no_heat_shock", 0]   # PRIMARY: HS25 vs NHS (matches human 25min)
    - ["heat_shock", 40, "no_heat_shock", 0]   # extended
  top_n: 100
  plots: true

# --- Divergent transcription ---
advanced:
  divergent_threshold: auto
  divergent_sum_thr: auto
  divergent_fdr: 0.05
  divergent_calibration_percentile: 65
  divergent_calibration_sum_multiplier: 1.5
  divergent_merge_gap: 150
  divergent_nt_window: 1000
  divergent_balance: 0.0
  divergent_qc: true

# --- Functional region geometry ---
functional_regions:
  tss_active_pm: 500
  prom_up: 500
  prom_down: 250

# --- Output ---
publish_trimmed_fastq: true
publish_alignments: true
output:
  cpm: true
  crpmsi: true
  raw_tracks: true
  bigwig: true
  bedgraph: true

