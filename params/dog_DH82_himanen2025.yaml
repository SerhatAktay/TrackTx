# ============================================================
# TrackTx Parameters — Dog DH82 PRO-seq (OUR PAPER)
# GEO: GSE274105 | Himanen et al. 2025, Cell Reports
# DOI: 10.1016/j.celrep.2025.116698
# Cell type: DH82 (canine macrophage-like line)
# Protocol: PRO-seq PE | Stress: 42°C, 30 min
# ============================================================
#
# This is our own published dataset — it serves as the methodological
# reference and blueprint for the entire comparative analysis.
# eCluster methodology was first applied here and should be reproduced
# exactly to confirm tracktx parity with published results.

# --- Core ---
samplesheet: "samplesheets/dog_DH82_himanen2025.csv"
sample_source: "srr"
paired_end: true
output_dir: "./results/dog_DH82_GSE274105"

# --- Genome ---
# Confirmed from Himanen et al. 2025 methods: canFam6 (Dog10K_Boxer_Tasha,
# GCF_000002285.5, released 2020 by Dog Genome Sequencing Consortium).
# This is the UCSC canFam6 assembly — most complete public dog reference.
reference_genome: "canFam6"       # Confirmed from Himanen 2025
spikein_genome: "dm6"             # Confirmed directly from Himanen et al. 2025
                                  # bioRxiv methods (2025.03.20.644285): "spike-in
                                  # chromatin from Drosophila S2 cells was added to
                                  # samples, counted to constitute 1% of the total
                                  # chromatin." dm6 matches.
control_label: "no_heat_shock"   # REQUIRED for correct siCPM — must match the baseline
                                  # condition name below exactly (module 08 has no
                                  # fallback if this doesn't match; see nextflow.config).
                                  # This dataset is the one that first surfaced the
                                  # siCPM control-selection bug (heat_shock listed
                                  # first in counts_master.tsv, so the old silent
                                  # fallback made it its own control).
annotation_source: "ensembl"      # NOTE: TrackTx's GTF module only implements a
                                  # real Ensembl fetch for hg38/hg19/mm39/mm10;
                                  # canFam6 is NOT in that list, so this setting
                                  # is currently a no-op and the pipeline silently
                                  # falls back to UCSC/NCBI RefSeq regardless.
                                  # Actual annotation is RefSeq until the pipeline
                                  # gains a real canFam6 Ensembl fetch path.
annotation_exclude_biotypes: ""  # No biotypes excluded (project-wide policy)
annotation_chr_naming: "none"

# --- Adapter trimming ---
# Confirmed from Vihervaara lab GitHub (github.com/Vihervaara/PRO-seq-analyses and
# PRO-IP-seq). TruSeq Small RNA adapters, standard Lis/Vihervaara lab PE protocol.
adapter_trimming:
  enabled: true
  preset: "custom"
  adapter1: "TGGAATTCTCGGGTGCCAAGGAACTCCAGTCAC"    # 3' adapter (R1) — TruSeq small RNA
  adapter2: "GATCGTCGGACTGTAGAACTCTGAACGTGTAGATCTCGGTGGTCGCCGTATCATT"  # 5' adapter (R2)
  minlen: 12

# --- UMI ---
# DISABLED — reversed from a prior "enabled" assumption after checking the
# actual published methods. This file previously cited "Vihervaara/PRO-IP-seq
# GitHub" (a different, IP-variant assay's code) for UMI_LEN=7 on R2. But the
# primary source for THIS dataset — Himanen et al. 2025 bioRxiv full text,
# "Analysis of PRO-seq data" and PRO-seq library-prep methods — describes
# standard TruSeq small-RNA 3' then 5' adapter ligation, RT, PCR, with no
# UMI/random-barcode step mentioned anywhere. Also, separately, location:
# "read2" was not even a value TrackTx's module 03 recognizes (it only
# extracts from R1, with "3" vs anything-else selecting 3' vs 5' end of R1)
# — so the old config was silently stripping 7nt off the 5' end of R1 rather
# than doing anything on R2. Disabling avoids both problems.
# TODO: if you can pull raw SRA read data for GSE274105, a quick empirical
# check (fixed-length random-looking prefix on R1 or R2 across reads) would
# confirm this one way or the other — recommended before treating this
# blueprint dataset as final.
umi:
  enabled: false

# --- Barcode ---
barcode:
  enabled: false

# --- Normalization ---
norm:
  emit_bw: true
  emit_sicpm: true
  emit_allmap: true
  emit_5p: true
  gene_end_method: tes_window
  gene_end_window: 500
  gene_end_min_reads: 10

# --- Replicates ---
replicates:
  merge: true
  concordance_method: pearson
  concordance_min: 0.90

# --- Polymerase contrasts ---
pol:
  contrasts:
    - ["heat_shock", 30, "no_heat_shock", 0]   # PRIMARY: HS30 vs NHS
  top_n: 100
  plots: true

# --- Divergent transcription ---
# Use same mammalian settings as human for comparability
advanced:
  divergent_threshold: auto
  divergent_sum_thr: auto
  divergent_fdr: 0.05
  divergent_calibration_percentile: 65
  divergent_calibration_sum_multiplier: 1.5
  divergent_merge_gap: 150
  divergent_nt_window: 1000
  divergent_balance: 0.0
  divergent_qc: true

# --- Functional region geometry ---
# MUST MATCH settings used in Himanen et al. 2025 to reproduce published results.
# Check supplementary methods of Himanen 2025 for exact window sizes used.
functional_regions:
  tss_active_pm: 500
  prom_up: 500
  prom_down: 250

# --- Output ---
publish_trimmed_fastq: true
publish_alignments: true
output:
  cpm: true
  crpmsi: true
  raw_tracks: true
  bigwig: true
  bedgraph: true

# ============================================================
# VALIDATION CHECKLIST:
#   □ Active site numbers match Himanen 2025 Table/Figure values
#   □ PI values at canonical HSP genes match published bigWigs
#   □ Enhancer count matches published values (check paper Fig)
#   □ eCluster results comparable to published supplementary data
# ============================================================

