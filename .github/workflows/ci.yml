# CI for the TrackTx pipeline: three tiers.
#
# 1. structural-dry-run: `nextflow run main.nf -preview` validates the DSL2
#    workflow (parameter handling, samplesheet parsing, channel/process
#    wiring) WITHOUT executing any process — no genome download, no
#    alignment, no containers pulled. Catches wiring/syntax regressions in
#    about a minute. Does NOT run real data through the pipeline (that would
#    require downloading/aligning against the full hs1 human genome used by
#    test_PE, impractical on standard GitHub-hosted runners) — see
#    test_PE/README.md for the real end-to-end smoke test.
#
# 2. module-tests: `nf-test` DOES execute real process bodies (against tiny
#    synthetic fixtures under tests/fixtures/, not real genomes), so this
#    catches a broken command/flag/script bug inside a process that -preview
#    cannot see. Currently covers modules 01, 08, 09, 11; add more
#    tests/modules/*.nf.test files as coverage grows.
#
# 3. script-selftests: some bin/*.py scripts carry a built-in, dependency-free
#    self-test (`--self-test`, or a bare `python3 script.py` for _common.py)
#    that exercises their pure-logic functions directly with synthetic data --
#    cheaper than fixturing a full Nextflow process when the fix being pinned
#    never touches files/samtools/bedtools, just Python logic. Runs on the
#    bare GitHub runner (stdlib only, no docker/conda needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Nextflow)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Validate pipeline wiring (structural dry-run, test_PE params)
        run: |
          nextflow run main.nf \
            -profile docker \
            -params-file test_PE/params_PE.yaml \
            -preview

  module-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Nextflow/nf-test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install nf-test
        run: |
          curl -fsSL https://code.askimed.com/install/nf-test | bash
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run module tests (real process execution, tiny fixtures)
        run: nf-test test tests/ --profile docker

  script-selftests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run bin/*.py self-tests
        run: |
          python3 bin/detect_barcode_umi.py --self-test
          python3 bin/_common.py
